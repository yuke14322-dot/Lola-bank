<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lola Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.22);
      --glass-border: rgba(255, 255, 255, 0.55);
      --glass-shine: rgba(255, 255, 255, 0.8);
      --text-main: #0f2b48;
      --text-muted: #2d5b88;
      --accent-blue: #0284c7;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
      position: relative;
      overflow-x: hidden;
      background: #0d2847;
    }

    /* Animated Liquid Background Spheres for Glass Distortion Effect */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(50px);
      z-index: 0;
      animation: float 12s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 320px;
      height: 320px;
      background: #38bdf8;
      top: -50px;
      left: -50px;
      opacity: 0.7;
    }

    .blob-2 {
      width: 380px;
      height: 380px;
      background: #0284c7;
      bottom: -80px;
      right: -50px;
      opacity: 0.8;
      animation-delay: -4s;
    }

    .blob-3 {
      width: 280px;
      height: 280px;
      background: #bfdbfe;
      top: 40%;
      left: 30%;
      opacity: 0.6;
      animation-delay: -8s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(60px, 40px) scale(1.15) rotate(180deg); }
      100% { transform: translate(-40px, 80px) scale(0.9) rotate(360deg); }
    }

    /* Main Container Card */
    .app-card {
      position: relative;
      z-index: 10;
      background: rgba(186, 230, 253, 0.28);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1.5px solid var(--glass-border);
      width: 100%;
      max-width: 420px;
      border-radius: 36px;
      padding: 24px;
      box-shadow: 0 30px 60px rgba(0, 20, 50, 0.35), inset 0 1px 2px var(--glass-shine);
    }

    /* Header Banner with Calligraphy Title & Avatar */
    .header-banner {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08), inset 0 1px 1px var(--glass-shine);
    }

    .bank-title {
      font-family: 'Great Vibes', cursive;
      font-size: 2.6rem;
      color: #ffffff;
      text-shadow: 0 3px 8px rgba(2, 132, 199, 0.6);
      line-height: 1;
    }

    .avatar-wrapper {
      position: relative;
    }

    .lola-avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e0f2fe, #ffffff);
      border: 2px solid var(--glass-shine);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }

    /* Big Oval Liquid Capsule Balance Display */
    .balance-capsule {
      background: rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid var(--glass-shine);
      border-radius: 40px;
      padding: 22px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 15px 30px rgba(0, 30, 80, 0.12), inset 0 2px 4px var(--glass-shine);
    }

    .balance-label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .balance-amount {
      font-size: 2.5rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
      margin: 4px 0 12px 0;
    }

    /* Embedded Pay / Save Bar inside Balance Capsule */
    .pay-input-wrapper {
      display: flex;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 25px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .pay-input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
    }

      color: #ffffff;
